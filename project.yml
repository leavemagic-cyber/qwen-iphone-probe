name: QwenIphoneProbe
options:
  bundleIdPrefix: org.opensource.qwenprobe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: "gnu17"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  QwenProbeHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
    dependencies:
      - xcframework: build-apple/llama.xcframework
        embed: true
      - sdk: Metal.framework
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opensource.qwenprobe.host
        PRODUCT_NAME: QwenProbeHost
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
  QwenProbeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - "*.h"
    dependencies:
      - target: QwenProbeHost
      - xcframework: build-apple/llama.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opensource.qwenprobe.tests
        PRODUCT_NAME: QwenProbeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QwenProbeHost.app/QwenProbeHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_OBJC_BRIDGING_HEADER: Tests/QwenProbeTests-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Tests"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        STRIP_INSTALLED_PRODUCT: NO
        COPY_PHASE_STRIP: NO
schemes:
  QwenProbeHost:
    build:
      targets:
        QwenProbeHost: all
        QwenProbeTests:
          - test
    test:
      config: Release
      targets:
        - QwenProbeTests
